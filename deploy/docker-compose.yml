# Serveur cadav derrière Caddy, qui obtient et renouvelle tout seul le certificat HTTPS (Let's Encrypt).
#
#   export CADAV_DOMAIN=cadav.exemple.org      # un nom DNS qui pointe vers ce serveur
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Les ports 80 et 443 doivent être ouverts. Les joueurs se connectent avec :
#   cadav play --url wss://cadav.exemple.org
services:
  cadav:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - cadav-data:/data
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - cadav
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADAV_DOMAIN: ${CADAV_DOMAIN:?définir CADAV_DOMAIN, par exemple cadav.exemple.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cadav-data:
  caddy-data:
  caddy-config:
