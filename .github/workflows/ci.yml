# Intégration continue : tests sur chaque push et chaque pull request,
# avec les versions de Python supportées (3.11 à 3.14).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  package:
    # The wheel must install and start in a clean environment, like `pipx install` would.
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Installer la roue dans un environnement vierge
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/cadav --version
          /tmp/clean/bin/cadav serve --help
          /tmp/clean/bin/cadav play --help
      - uses: actions/upload-artifact@v4
        with:
          name: cadav-dist
          path: dist
          retention-days: 7

  docker:
    # L'image de déploiement doit se construire et répondre sur /health.
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t cadav .
      - name: Démarrer le conteneur et attendre qu'il réponde
        run: |
          docker run -d --name cadav -p 8765:8765 -v cadav-data:/data cadav
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health
          docker logs cadav
      - name: Arrêt propre (SIGTERM) avec code de sortie 0
        run: |
          docker stop cadav
          test "$(docker inspect -f '{{.State.ExitCode}}' cadav)" = "0"
