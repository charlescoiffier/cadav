[project]
name = "cadav"
version = "0.1.0"
description = "cadav : cadavre exquis multijoueur en terminal"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "websockets>=13", "textual>=1.0"]

[project.scripts]
cadav = "cadav.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cadav", "cadav.client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
