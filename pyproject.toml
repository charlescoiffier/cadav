[project]
name = "cadav"
dynamic = ["version"]
description = "cadav : cadavre exquis multijoueur en terminal"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cadavre exquis", "terminal", "tui", "textual", "multijoueur"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = ["pydantic>=2.6", "websockets>=13", "textual>=1.0"]

[project.urls]
Homepage = "https://github.com/charlescoiffier/cadav"
Issues = "https://github.com/charlescoiffier/cadav/issues"

[project.scripts]
cadav = "cadav.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "cadav.__version__"}

[tool.setuptools]
packages = ["cadav", "cadav.client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
